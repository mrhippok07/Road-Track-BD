<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফিড — Road Track BD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;900&family=Noto+Sans+Bengali:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <style>
        :root {
            --green-neon: #00ff88;
            --green-dark: #006a4e;
            --red-neon: #ff1744;
            --yellow-neon: #ffd600;
            --blue-neon: #2196f3;
            --bg-deep: #020a05;
            --bg-panel: rgba(0, 15, 8, 0.85);
            --glass-border: rgba(0, 255, 136, 0.15);
            --text-primary: #e0fff0;
            --text-muted: rgba(180, 255, 210, 0.6);
            --glow-green: 0 0 20px rgba(0, 255, 136, 0.4), 0 0 60px rgba(0, 255, 136, 0.1);
            --glow-red: 0 0 20px rgba(255, 23, 68, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Noto Sans Bengali', 'Exo 2', sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 40% at 20% 50%, rgba(0, 106, 78, 0.12) 0%, transparent 70%), repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(0, 255, 136, 0.02) 80px);
            pointer-events: none;
            z-index: 0;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            height: 64px;
            background: rgba(2, 10, 5, 0.92);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo { height: 36px; width: auto; object-fit: contain; }

        .brand-title {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--green-neon), #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 0.3rem;
        }

        .nav-link {
            padding: 6px 16px;
            font-size: 0.78rem;
            color: var(--text-muted);
            text-decoration: none;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.25s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--green-neon);
            border-color: var(--glass-border);
            background: rgba(0, 255, 136, 0.05);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--green-neon);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--green-neon);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        main {
            position: relative;
            z-index: 1;
            padding: 90px 1.5rem 4rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--green-neon);
        }

        .filter-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }

        .filter-chip {
            padding: 6px 14px;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .filter-chip:hover,
        .filter-chip.active {
            border-color: var(--green-neon);
            color: var(--green-neon);
            background: rgba(0, 255, 136, 0.06);
        }

        .new-report-btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, var(--green-dark), #005a40);
            border: 1px solid var(--green-neon);
            border-radius: 6px;
            color: var(--green-neon);
            font-size: 0.78rem;
            font-family: 'Noto Sans Bengali', sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s;
        }

        .new-report-btn:hover {
            background: var(--green-neon);
            color: var(--bg-deep);
        }

        /* Feed Post Creation Box */
        .feed-post-card {
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 1.2rem;
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .feed-post-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--green-neon), var(--blue-neon), var(--green-neon));
        }
        .post-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .post-user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-dark), #004d38);
            border: 1.5px solid var(--green-neon);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--green-neon);
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }
        .post-user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .post-user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .post-user-name {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Noto Sans Bengali', sans-serif;
        }
        .post-user-role {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-family: 'Exo 2', sans-serif;
        }
        .post-input {
            width: 100%;
            min-height: 80px;
            background: rgba(0, 255, 136, 0.03) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-primary) !important;
            font-family: 'Noto Sans Bengali', sans-serif;
            font-size: 0.85rem;
            outline: none;
            resize: vertical;
            transition: all 0.25s;
            margin-bottom: 10px;
        }
        .post-input:focus {
            border-color: var(--green-neon) !important;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.15) !important;
            background: rgba(0, 255, 136, 0.06) !important;
        }
        .post-attachments-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .post-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .post-options {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .post-type-select {
            background: rgba(0, 15, 8, 0.9) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 8px;
            padding: 6px 12px;
            color: var(--text-primary) !important;
            font-size: 0.78rem;
            font-family: 'Noto Sans Bengali', sans-serif;
            outline: none;
            cursor: pointer;
        }
        .post-photo-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans Bengali', sans-serif;
        }
        .post-photo-btn:hover {
            border-color: var(--green-neon);
            color: var(--green-neon);
            background: rgba(0, 255, 136, 0.1);
        }
        .post-submit-btn {
            padding: 8px 22px;
            background: linear-gradient(135deg, var(--green-dark), #005a40);
            border: 1px solid var(--green-neon);
            border-radius: 8px;
            color: var(--green-neon);
            font-size: 0.82rem;
            font-family: 'Noto Sans Bengali', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: var(--glow-green);
        }
        .post-submit-btn:hover {
            background: var(--green-neon);
            color: var(--bg-deep);
            transform: translateY(-1px);
        }

        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feed-card {
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            transition: all 0.3s;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feed-card:hover {
            border-color: rgba(0, 255, 136, 0.25);
        }

        .feed-card-top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px 10px;
        }

        .feed-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }

        .feed-meta {
            flex: 1;
        }

        .feed-road {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .feed-loc {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .feed-badge {
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.6rem;
            font-family: 'Exo 2', sans-serif;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .feed-type-chip {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.62rem;
            background: rgba(255, 23, 68, 0.1);
            border: 1px solid rgba(255, 23, 68, 0.25);
            color: var(--red-neon);
            font-family: 'Exo 2', sans-serif;
            margin: 0 16px 6px;
        }

        .feed-desc {
            padding: 0 16px 10px;
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.6;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .feed-photos {
            display: flex;
            gap: 6px;
            padding: 0 16px 10px;
            flex-wrap: wrap;
        }

        .feed-photo {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
        }

        .feed-actions {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            border-top: 1px solid var(--glass-border);
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .action-btn:hover {
            border-color: var(--green-neon);
            color: var(--green-neon);
        }

        .action-btn.liked {
            border-color: var(--red-neon);
            color: var(--red-neon);
        }

        .action-btn.reacted {
            border-color: #ffd600;
            color: #ffd600;
        }

        .feed-comments {
            padding: 10px 16px;
            border-top: 1px solid var(--glass-border);
            display: none;
        }

        .feed-comments.open {
            display: block;
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .comment-item {
            background: rgba(0, 255, 136, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .comment-author {
            font-size: 0.65rem;
            color: var(--green-neon);
            font-family: 'Exo 2', sans-serif;
            margin-bottom: 3px;
        }

        .comment-text {
            font-size: 0.75rem;
            color: var(--text-primary);
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .comment-input-row {
            display: flex;
            gap: 8px;
        }

        .comment-input {
            flex: 1;
            background: rgba(0, 255, 136, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-family: 'Noto Sans Bengali', sans-serif;
            font-size: 0.78rem;
            outline: none;
        }

        .comment-input:focus {
            border-color: var(--green-neon);
        }

        .comment-send {
            padding: 8px 14px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--green-neon);
            border-radius: 6px;
            color: var(--green-neon);
            font-size: 0.72rem;
            cursor: pointer;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .comment-send:hover {
            background: var(--green-neon);
            color: var(--bg-deep);
        }

        .update-btn {
            padding: 6px 12px;
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid #2196f3;
            border-radius: 6px;
            color: #2196f3;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .update-btn:hover {
            background: #2196f3;
            color: #fff;
        }

        .status-update-form {
            margin-top: 8px;
            display: none;
            background: rgba(0, 255, 136, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 10px;
        }

        .status-update-form.open {
            display: block;
        }

        .status-update-form select {
            background: #021008;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-family: 'Noto Sans Bengali', sans-serif;
            font-size: 0.8rem;
            width: 100%;
            margin-bottom: 8px;
            outline: none;
        }

        .status-update-form button {
            padding: 7px 16px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--green-neon);
            border-radius: 6px;
            color: var(--green-neon);
            font-size: 0.72rem;
            cursor: pointer;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .load-more-btn {
            width: 100%;
            padding: 12px;
            background: rgba(0, 255, 136, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.25s;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .load-more-btn:hover {
            border-color: var(--green-neon);
            color: var(--green-neon);
        }

        .share-popup {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }

        .share-popup.open {
            display: flex;
        }

        .share-box {
            background: #021008;
            border: 1px solid var(--green-neon);
            border-radius: 12px;
            padding: 1.5rem;
            min-width: 300px;
            max-width: 420px;
            width: 90%;
        }

        .share-box h3 {
            font-family: 'Exo 2', sans-serif;
            font-size: 0.85rem;
            color: var(--green-neon);
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .share-url {
            width: 100%;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.75rem;
            margin-bottom: 10px;
            outline: none;
        }

        .share-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .share-opt {
            padding: 8px 14px;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.72rem;
            cursor: pointer;
            background: transparent;
            font-family: 'Noto Sans Bengali', sans-serif;
            transition: all 0.2s;
        }

        .share-opt:hover {
            border-color: var(--green-neon);
            color: var(--green-neon);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            background: rgba(2, 10, 5, 0.95);
            border: 1px solid var(--green-neon);
            border-radius: 8px;
            color: var(--green-neon);
            font-size: 0.82rem;
            z-index: 9999;
            display: none;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .toast.error {
            border-color: var(--red-neon);
            color: var(--red-neon);
        }

        @media(max-width:600px) {
            nav {
                padding: 0 1rem;
            }

            

            .feed-actions {
                flex-wrap: wrap;
            }
        }
    



.hamburger-btn {
  display: none;
  flex-direction: column;
  justify-content: space-between;
  width: 28px;
  height: 20px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  z-index: 1200;
  margin-left: 8px;
}
.hamburger-btn .bar {
  width: 100%;
  height: 2px;
  background: #00ff88;
  border-radius: 2px;
  transition: all 0.3s ease;
}

.hamburger-btn.open .bar:nth-child(1) { transform: translateY(9px) rotate(45deg); }
.hamburger-btn.open .bar:nth-child(2) { opacity: 0; }
.hamburger-btn.open .bar:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }


.mobile-drawer {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(2,10,5,0.97);
  z-index: 1100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  opacity: 0;
  transition: opacity 0.25s ease;
}
.mobile-drawer.open {
  display: flex;
  opacity: 1;
}
.mobile-drawer .drawer-link {
  width: 100%;
  padding: 20px 40px;
  font-size: 1.3rem;
  font-family: 'Noto Sans Bengali', 'Exo 2', sans-serif;
  color: rgba(180,255,210,0.7);
  text-decoration: none;
  border-bottom: 1px solid rgba(0,255,136,0.08);
  text-align: center;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.mobile-drawer .drawer-link:first-child { border-top: 1px solid rgba(0,255,136,0.08); }
.mobile-drawer .drawer-link:hover,
.mobile-drawer .drawer-link.active {
  color: #00ff88;
  background: rgba(0,255,136,0.06);
  text-shadow: 0 0 15px rgba(0,255,136,0.5);
}
.mobile-drawer .drawer-link .link-icon { margin-right: 12px; font-size: 1.1rem; }

.mobile-drawer .drawer-close {
  position: absolute;
  top: 20px; right: 20px;
  background: none; border: none;
  color: rgba(0,255,136,0.6);
  font-size: 1.8rem; cursor: pointer;
  line-height: 1;
}
.mobile-drawer .drawer-close:hover { color: #00ff88; }


@media screen and (max-width: 768px) {
  nav {
    padding: 0 1rem !important;
    height: 60px !important;
    flex-wrap: nowrap !important;
    align-items: center !important;
    justify-content: space-between !important;
  }

  
  

  
  .hamburger-btn { display: flex !important; }

  
  .brand-title { font-size: 0.9rem !important; letter-spacing: 1px !important; }
  .brand-sub { display: none !important; }
  .brand-logo { height: 30px !important; }

  
  #whiteboxTrigger span:last-child { display: none !important; }
  #whiteboxTrigger { padding: 6px 8px !important; }

  
  .dash-wrap { padding: 75px 0.8rem 2rem !important; }
  .main-container, .page-wrap { padding-top: 75px !important; }

  
  .kpi-grid,
  .charts-grid,
  .form-grid,
  .vol-grid { grid-template-columns: 1fr !important; gap: 10px !important; }

  
  input, select, textarea { font-size: 16px !important; }

  
  .modal-box, .auth-modal-inner { width: 94% !important; padding: 1.4rem !important; max-height: 90vh !important; overflow-y: auto !important; }
}

</style>

</head>

<body>
    <nav>
        <a class="nav-brand" href="/"><img src="/assets/logo.png" alt="Road Track BD Logo" class="brand-logo" /><span class="brand-title">Road Track BD</span></a>
        <div class="nav-links">
            <a class="nav-link" href="/" data-i18n="nav.map">ম্যাপ</a>
            <a class="nav-link" href="/report" data-i18n="nav.report">রিপোর্ট</a>
            <a class="nav-link active" href="/feed" data-i18n="nav.feed">ফিড</a>
            <a class="nav-link" href="/dashboard" data-i18n="nav.dashboard">ড্যাশবোর্ড</a>
            <a class="nav-link" href="/volunteer" data-i18n="nav.volunteer">স্বেচ্ছাসেবক</a>
        </div>
        <div id="navRight" style="display:flex;gap:10px;align-items:center;">
            <div class="nav-status"><div class="status-dot"></div><span data-i18n="nav.live">লাইভ</span></div>
            <div class="profile-btn" id="authBtn" onclick="openAuthModal()" title="লগইন / প্রোফাইল">
                <div class="profile-avatar-mini" style="font-size:1.1rem; border:none; background:transparent;"><i class="fa-solid fa-user"></i></div>
            </div>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h1 data-i18n="feed.title"><i class="fa-regular fa-newspaper"></i> লাইভ রিপোর্ট ফিড</h1>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <a href="/report" class="new-report-btn" data-i18n="feed.newReport"><i class="fa-solid fa-plus"></i> নতুন রিপোর্ট</a>
                <button onclick="openOpinionModal()" class="new-report-btn" style="background:transparent; border-color:var(--blue-neon); color:var(--text-primary); cursor:pointer;" data-i18n="feed.opinionBtn"><i class="fa-regular fa-comments"></i> জনমতামত দিন</button>
            </div>
        </div>

        <!-- Cyber/Neon Feed Post Creation Card -->
        <div class="feed-post-card" id="feedPostCard">
            <div class="post-card-header">
                <div class="post-user-avatar" id="feedUserAvatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="post-user-info">
                    <div class="post-user-name" id="feedUserName">আপনার মতামত বা আপডেট শেয়ার করুন</div>
                    <div class="post-user-role" id="feedUserRole"><i class="fa-solid fa-earth-americas"></i> পাবলিক পোস্ট</div>
                </div>
            </div>
            <textarea class="post-input" id="inlinePostText" placeholder="আপনার এলাকার রাস্তার সমস্যা, নতুন সংস্কার বা জনমতামত শেয়ার করুন..."></textarea>
            <div class="post-attachments-preview" id="inlinePhotosPreview"></div>
            <div class="post-card-footer">
                <div class="post-options">
                    <select id="inlineProblemType" class="post-type-select">
                        <option value="opinion">💬 সাধারণ মতামত</option>
                        <option value="broken">⚠️ ভাঙা রাস্তা</option>
                        <option value="pothole">🕳️ বড় গর্ত</option>
                        <option value="waterlogged">🌊 পানি জমা</option>
                        <option value="dangerous">🚨 ঝুঁকিপূর্ণ</option>
                        <option value="bridge_repair">🌉 ব্রিজ সংস্কার</option>
                        <option value="canal_large">💧 খাল খনন</option>
                        <option value="tube_well_needed">🚰 নলকূপ প্রয়োজন</option>
                    </select>
                    <label class="post-photo-btn" title="ছবি যোগ করুন (সর্বোচ্চ ৩টি)">
                        <i class="fa-solid fa-image" style="color:var(--green-neon);"></i> <span>ছবি</span>
                        <input type="file" id="inlinePhotoInput" accept="image/*" multiple style="display:none;" onchange="handleInlinePhotos(event)">
                    </label>
                </div>
                <button class="post-submit-btn" id="inlinePostBtn" onclick="submitInlinePost()">
                    <i class="fa-solid fa-paper-plane"></i> <span>প্রকাশ করুন</span>
                </button>
            </div>
        </div>

        <div class="filter-row">
            <button class="filter-chip active" onclick="filterFeed('all',this)" data-i18n="feed.all">সব</button>
            <button class="filter-chip" onclick="filterFeed('pending',this)" data-i18n="feed.pending">মেরামত বাকি</button>
            <button class="filter-chip" onclick="filterFeed('under_repair',this)" data-i18n="feed.repair">সংস্কার চলছে</button>
            <button class="filter-chip" onclick="filterFeed('repaired',this)" data-i18n="feed.repaired">সংস্কার সম্পন্ন</button>
            <button class="filter-chip" onclick="filterFeed('bridge_repair',this)" data-i18n="feed.bridge">ব্রিজ</button>
            <button class="filter-chip" onclick="filterFeed('canal_large',this)" data-i18n="feed.canal">খাল</button>
            <button class="filter-chip" onclick="filterFeed('tube_well_needed',this)" data-i18n="feed.tubewell">নলকূপ</button>
            <button class="filter-chip" onclick="filterFeed('opinion',this)" style="border-color:var(--blue-neon); color:var(--blue-neon);" data-i18n="feed.tagOpinion"><i class="fa-regular fa-comments"></i> মতামত ট্যাগ</button>
        </div>
        <div class="feed-list" id="feedList">
            <div style="color:var(--text-muted);text-align:center;padding:3rem;" data-i18n="ui.loading">লোড হচ্ছে...</div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()" data-i18n="feed.loadMore">আরও দেখুন ↓</button>
    </main>

    <div class="share-popup" id="sharePopup">
        <div class="share-box">
            <h3 data-i18n="ui.shareTitle"><i class="fa-solid fa-link"></i> শেয়ার করুন</h3>
            <input class="share-url" type="text" id="shareUrl" readonly>
            <div class="share-btns">
                <button class="share-opt" onclick="copyShareUrl()" data-i18n="ui.copy"><i class="fa-solid fa-clipboard-list"></i> কপি করুন</button>
                <button class="share-opt" onclick="shareWhatsApp()">WhatsApp</button>
                <button class="share-opt" onclick="shareFacebook()">Facebook</button>
                <button class="share-opt" onclick="closeShare()" data-i18n="ui.close"><i class="fa-solid fa-xmark"></i> বন্ধ করুন</button>
            </div>
        </div>
    </div>
    <div class="share-popup" id="opinionPopup">
        <div class="share-box">
            <h3 data-i18n="feed.giveOpinion"><i class="fa-regular fa-comments"></i> জনমতামত দিন</h3>
            <textarea id="opinionText" style="width:100%; min-height:100px; background:rgba(0,255,136,0.05); border:1px solid var(--glass-border); border-radius:6px; padding:10px; color:var(--text-primary); font-size:0.8rem; margin-bottom:10px; resize:vertical;" data-i18n-placeholder="feed.opinionPl" placeholder="আপনার মতামত বা পরামর্শ লিখুন..."></textarea>
            <div class="share-btns">
                <button class="share-opt" style="border-color:var(--green-neon); color:var(--green-neon);" onclick="submitOpinion()" data-i18n="feed.publish"><i class="fa-solid fa-paper-plane"></i> প্রকাশ করুন</button>
                <button class="share-opt" onclick="closeOpinionModal()" data-i18n="ui.close"><i class="fa-solid fa-xmark"></i> বন্ধ করুন</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="/assets/js/main.js"></script>
    <script>
        let currentPage = 1, currentFilter = 'all', allDone = false;
        let currentShareUrl = '';
        let inlineSelectedFiles = [];

        function statusColor(s, type) {
            if (type === 'opinion') return '#00f2ff';
            return { pending: '#ff1744', under_repair: '#2196f3', repaired: '#00ff88', rejected: '#546e7a' }[s] || '#ff1744';
        }
        function statusLabel(s) { return getStatusLabel(s); }

        function buildCard(r) {
            const color = getMarkerColor(r);
            const sColor = statusColor(r.status, r.problemType);
            const sLabel = statusLabel(r.status);
            const hasPhotos = r.photos && r.photos.length > 0;
            const photosHtml = hasPhotos ? `<div class="feed-photos">${r.photos.map(p => `<img class="feed-photo" src="${p}" onclick="openPhoto('${p}')">`).join('')}</div>` : '';
            const typeLabel = getProblemLabel(r.problemType);
            const u = getUser();
            const isOwner = u && (u.id === r.userId || u.role === 'সরকারিকর্মকর্তা');
            const updateBtnHtml = isOwner ? `<button class="update-btn" onclick="toggleUpdate('${r._id}')">${t('feed.update')}</button>` : '';

            const authorName = r.reporterName || 'অজ্ঞাত';
            const roleBadge = r.role ? `<span style="padding:1px 7px;background:rgba(0,255,136,0.1);border:1px solid var(--glass-border);border-radius:10px;font-size:0.6rem;color:var(--green-neon);font-family:'Noto Sans Bengali',sans-serif;font-weight:normal;">${r.role}</span>` : '';
            const avatarHtml = r.avatar 
                ? `<img src="${r.avatar}" alt="" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:1.5px solid var(--green-neon);box-shadow:0 0 8px rgba(0,255,136,0.2);flex-shrink:0;">`
                : `<div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--green-dark),#004d38);border:1.5px solid var(--green-neon);display:flex;align-items:center;justify-content:center;color:var(--green-neon);font-size:1.1rem;flex-shrink:0;">${r.icon || '<i class="fa-solid fa-user"></i>'}</div>`;

            return `<div class="feed-card" id="card-${r._id}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px;">
      <div style="display:flex;align-items:center;gap:10px;">
        ${avatarHtml}
        <div style="display:flex;flex-direction:column;gap:2px;">
          <div style="font-size:0.88rem;font-weight:700;color:var(--text-primary);font-family:'Noto Sans Bengali',sans-serif;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            ${authorName} ${roleBadge}
          </div>
          <div class="feed-loc">
            ${r.problemType !== 'opinion' ? `<i class="fa-solid fa-location-dot" style="color:var(--green-neon)"></i> <strong>${r.roadName}</strong> — ${r.district || ''} ${r.area ? ' (' + r.area + ')' : ''} &nbsp;·&nbsp; ` : ''}
            <i class="fa-regular fa-clock"></i> ${formatTime(r.createdAt)}
          </div>
        </div>
      </div>
      <div>
        ${r.problemType !== 'opinion' ? `<div class="feed-badge" style="background:${sColor}22;border:1px solid ${sColor}55;color:${sColor}">${sLabel}</div>` : ''}
      </div>
    </div>
    <div style="padding:0 16px 4px;">
      <span class="feed-type-chip">${typeLabel}</span>
    </div>
    ${r.description ? `<div class="feed-desc">${r.description}</div>` : ''}
    ${photosHtml}
    <div class="feed-actions">
      <button class="action-btn ${(r.userLiked)?'liked':''}" onclick="toggleLike('${r._id}',this)"><i class="fa-solid fa-heart"></i> <span id="like-${r._id}">${r.likes||0}</span></button>
      <button class="action-btn ${(r.userReacted)?'reacted':''}" onclick="toggleReact('${r._id}',this)">${getReactionEmoji(r.problemType)} <span id="react-${r._id}">${r.reactions||0}</span></button>
      <button class="action-btn" onclick="toggleComments('${r._id}')"><i class="fa-regular fa-comments"></i> ${t('feed.commentLabel')} <span id="cmtCount-${r._id}">${r.commentCount||0}</span></button>
      <button class="action-btn" onclick="openShare('${r._id}')"><i class="fa-solid fa-share-nodes"></i> <span>${t('feed.share')}</span></button>
      ${r.problemType !== 'opinion' ? updateBtnHtml : ''}
    </div>
    <div class="feed-comments" id="comments-${r._id}">
      <div class="comment-list" id="commentList-${r._id}"></div>
      <div class="comment-input-row">
        <input class="comment-input" id="cmtInput-${r._id}" placeholder="${t('feed.comment')}" onkeydown="if(event.key==='Enter')sendComment('${r._id}')">
        <button class="comment-send" onclick="sendComment('${r._id}')">${t('feed.send')}</button>
      </div>
    </div>
    <div class="status-update-form" id="updateForm-${r._id}">
      <select id="updateStatus-${r._id}">
        <option value="pending">${t('status.pending.dot')}</option>
        <option value="under_repair">${t('status.repair.dot')}</option>
        <option value="repaired">${t('status.done.dot')}</option>
        <option value="rejected">${t('status.rejected')}</option>
      </select>
      <button onclick="submitStatusUpdate('${r._id}')"><i class="fa-solid fa-check"></i> ${t('feed.doUpdate')}</button>
    </div>
  </div>`;
        }

        async function loadFeed(reset = false) {
            if (reset) { currentPage = 1; allDone = false; document.getElementById('feedList').innerHTML = ''; }
            if (allDone) return;
            try {
                let url = `/api/reports?page=${currentPage}&limit=10`;
                if (currentFilter !== 'all') {
                    if (['pending', 'under_repair', 'repaired', 'rejected'].includes(currentFilter)) url += `&status=${currentFilter}`;
                    else url += `&type=${currentFilter}`;
                }
                const d = await apiFetch(url);
                if (d.success) {
                    const list = document.getElementById('feedList');
                    if (reset || currentPage === 1) list.innerHTML = '';
                    if (!d.data.length && currentPage === 1) { list.innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:3rem;">${t('feed.noReport')}</div>`; return; }
                    d.data.forEach(r => { list.insertAdjacentHTML('beforeend', buildCard(r)); });
                    if (d.data.length < 10) allDone = true;
                    document.getElementById('loadMoreBtn').style.display = allDone ? 'none' : 'block';
                }
            } catch (e) { document.getElementById('feedList').innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:3rem;">${t('feed.loadingDataFailed')}</div>`; }
        }

        function filterFeed(f, btn) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = f;
            loadFeed(true);
        }

        function loadMore() { currentPage++; loadFeed(); }

        function toggleComments(id) {
            const el = document.getElementById('comments-' + id);
            const isOpen = el.classList.contains('open');
            el.classList.toggle('open');
            if (!isOpen) loadComments(id);
        }

        async function loadComments(id) {
            try {
                const d = await apiFetch(`/api/feed/${id}/comments`);
                const list = document.getElementById('commentList-' + id);
                if (d.success && d.data.length) {
                    list.innerHTML = d.data.map(c => `<div class="comment-item"><div class="comment-author">${c.authorName || 'অজ্ঞাত'}</div><div class="comment-text">${c.text}</div></div>`).join('');
                } else { list.innerHTML = `<div style="font-size:0.72rem;color:var(--text-muted);text-align:center;padding:6px;">${t('feed.noComment')}</div>`; }
            } catch (e) { }
        }

        async function sendComment(id) {
            const inp = document.getElementById('cmtInput-' + id);
            const text = inp.value.trim();
            if (!text) return;
            const u = getUser();
            if (!u) {
                showToast(t('toast.commentLoginReq'), 'error');
                if (typeof openAuthModal === 'function') openAuthModal();
                return;
            }
            try {
                const d = await apiPost(`/api/feed/${id}/comments`, { text });
                if (d.success) { inp.value = ''; loadComments(id); const span = document.getElementById('cmtCount-' + id); if (span) span.textContent = parseInt(span.textContent || 0) + 1; }
                else showToast(d.message || t('toast.commentError'), 'error');
            } catch (e) { showToast(t('toast.serverError'), 'error'); }
        }

        async function toggleLike(id, btn) {
            const u = getUser();
            if (!u) {
                showToast(t('toast.likeLoginReq'), 'error');
                if (typeof openAuthModal === 'function') openAuthModal();
                return;
            }
            try {
                const d = await apiPost(`/api/feed/${id}/like`, {});
                if (d.success) {
                    document.getElementById('like-' + id).textContent = d.likes;
                    btn.classList.toggle('liked', d.liked);
                }
            } catch (e) { }
        }

        async function toggleReact(id, btn) {
            const u = getUser();
            if (!u) {
                showToast(t('toast.reactLoginReq'), 'error');
                if (typeof openAuthModal === 'function') openAuthModal();
                return;
            }
            try {
                const d = await apiPost(`/api/feed/${id}/react`, {});
                if (d.success) {
                    document.getElementById('react-' + id).textContent = d.reactions;
                    btn.classList.toggle('reacted', d.reacted);
                }
            } catch (e) { }
        }

        function toggleUpdate(id) { document.getElementById('updateForm-' + id).classList.toggle('open'); }

        async function submitStatusUpdate(id) {
            const status = document.getElementById('updateStatus-' + id).value;
            try {
                const d = await apiPut(`/api/reports/${id}/status`, { status });
                if (d.success) { showToast(t('toast.statusUpdated')); loadFeed(true); }
                else showToast(d.message || t('toast.updateFailed'), 'error');
            } catch (e) { showToast(t('toast.serverError'), 'error'); }
        }

        function openShare(id) {
            currentShareUrl = window.location.origin + '/feed?report=' + id;
            document.getElementById('shareUrl').value = currentShareUrl;
            document.getElementById('sharePopup').classList.add('open');
        }
        function closeShare() { document.getElementById('sharePopup').classList.remove('open'); }
        function copyShareUrl() { navigator.clipboard.writeText(currentShareUrl); showToast(t('toast.linkCopied')); }
        function shareWhatsApp() { window.open('https://wa.me/?text=' + encodeURIComponent('Road Track BD — ' + currentShareUrl)); }
        function shareFacebook() { window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(currentShareUrl)); }
        function openPhoto(src) { window.open(src, '_blank'); }

        document.getElementById('sharePopup').addEventListener('click', function (e) { if (e.target === this) closeShare(); });
        document.getElementById('opinionPopup').addEventListener('click', function (e) { if (e.target === this) closeOpinionModal(); });

        function openOpinionModal() {
            const u = getUser();
            if (!u) {
                showToast(t('toast.opinionLoginReq'), 'error');
                if (typeof openAuthModal === 'function') openAuthModal();
                return;
            }
            document.getElementById('opinionText').value = '';
            document.getElementById('opinionPopup').classList.add('open');
        }

        function closeOpinionModal() {
            document.getElementById('opinionPopup').classList.remove('open');
        }

        async function submitOpinion() {
            const text = document.getElementById('opinionText').value.trim();
            if (!text) { showToast(t('toast.writeSomething'), 'error'); return; }
            try {
                const d = await apiPost('/api/reports', {
                    problemType: 'opinion',
                    description: text,
                    roadName: 'সাধারণ মতামত',
                    district: '-',
                    area: '-'
                });
                if (d.success) {
                    showToast(t('toast.opinionPublished'));
                    closeOpinionModal();
                    if (currentFilter === 'all' || currentFilter === 'opinion') {
                        loadFeed(true);
                    }
                } else {
                    showToast(d.message || t('toast.publishedFailed'), 'error');
                }
            } catch (e) {
                showToast(t('toast.serverError'), 'error');
            }
        }

        function handleInlinePhotos(e) {
            inlineSelectedFiles = Array.from(e.target.files).slice(0, 3);
            const prev = document.getElementById('inlinePhotosPreview');
            prev.innerHTML = '';
            inlineSelectedFiles.forEach(f => {
                const r = new FileReader();
                r.onload = ev => {
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    img.className = 'feed-photo';
                    prev.appendChild(img);
                };
                r.readAsDataURL(f);
            });
        }

        async function submitInlinePost() {
            const u = getUser();
            if (!u) {
                showToast(t('toast.opinionLoginReq'), 'error');
                if (typeof openAuthModal === 'function') openAuthModal();
                return;
            }
            const text = document.getElementById('inlinePostText').value.trim();
            const problemType = document.getElementById('inlineProblemType').value || 'opinion';

            if (!text && inlineSelectedFiles.length === 0) {
                showToast(t('toast.writeSomething'), 'error');
                return;
            }

            const btn = document.getElementById('inlinePostBtn');
            btn.disabled = true;
            btn.querySelector('span').textContent = 'প্রকাশ হচ্ছে...';

            const fd = new FormData();
            fd.append('problemType', problemType);
            fd.append('description', text);
            fd.append('roadName', problemType === 'opinion' ? 'সাধারণ মতামত' : 'ফিড আপডেট');
            fd.append('district', '-');
            fd.append('area', '-');
            inlineSelectedFiles.forEach(f => fd.append('photos', f));

            try {
                const d = await apiFormPost('/api/reports', fd);
                if (d.success) {
                    showToast('<i class="fa-solid fa-check"></i> পোস্ট সফলভাবে প্রকাশ হয়েছে!');
                    document.getElementById('inlinePostText').value = '';
                    document.getElementById('inlinePhotosPreview').innerHTML = '';
                    inlineSelectedFiles = [];
                    if (window._socket) window._socket.emit('report_new', d.data);
                    loadFeed(true);
                } else {
                    showToast(d.message || t('toast.publishedFailed'), 'error');
                }
            } catch (e) {
                showToast(t('toast.serverError'), 'error');
            } finally {
                btn.disabled = false;
                btn.querySelector('span').textContent = 'প্রকাশ করুন';
            }
        }

        function updatePostUserHeader() {
            const u = getUser();
            const avatarEl = document.getElementById('feedUserAvatar');
            const nameEl = document.getElementById('feedUserName');
            const roleEl = document.getElementById('feedUserRole');
            if (!avatarEl || !nameEl) return;
            if (u) {
                nameEl.textContent = u.name;
                roleEl.innerHTML = `<i class="fa-solid fa-shield-halved"></i> ${u.role || 'সাধারণ'} &nbsp;·&nbsp; ${u.address || 'বাংলাদেশ'}`;
                if (u.avatar) {
                    avatarEl.innerHTML = `<img src="${u.avatar}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
                } else if (u.icon) {
                    avatarEl.innerHTML = u.icon;
                } else {
                    avatarEl.innerHTML = '<i class="fa-solid fa-user"></i>';
                }
            } else {
                nameEl.textContent = 'আপনার মতামত বা আপডেট শেয়ার করুন';
                roleEl.innerHTML = '<i class="fa-solid fa-earth-americas"></i> পোস্ট করতে ক্লিক/লগইন করুন';
                avatarEl.innerHTML = '<i class="fa-solid fa-user"></i>';
            }
        }

        initSocket(sk=>{
            sk.on('report_update',r=>{
                const existing=document.getElementById('card-'+r._id);
                if(existing){existing.outerHTML=buildCard(r);}
                else{const list=document.getElementById('feedList');list.insertAdjacentHTML('afterbegin',buildCard(r));showToast(t('toast.newReportToast') + ': ' + r.roadName,'');}
            });
            
            sk.on('comment_new',({reportId,comment})=>{
                const list=document.getElementById('commentList-'+reportId);
                if(list){
                    const noMsg=list.querySelector('[data-no-comment]');
                    if(noMsg)noMsg.remove();
                    list.insertAdjacentHTML('beforeend',`<div class="comment-item"><div class="comment-author">${comment.authorName||'ব্যবহারকারী'}</div><div class="comment-text">${comment.text}</div></div>`);
                    list.scrollTop=list.scrollHeight;
                    const cnt=document.getElementById('cmtCount-'+reportId);
                    if(cnt)cnt.textContent=parseInt(cnt.textContent||0)+1;
                }
            });
        });

        window.addEventListener('DOMContentLoaded',()=>{
            renderNavAuth(); injectLangToggle('nav'); applyLang();
            updatePostUserHeader();
            loadFeed(true);
        });
    </script>

<script>

(function() {
  var btn = document.querySelector('.hamburger-btn');
  var drawer = document.querySelector('.mobile-drawer');
  if (!btn || !drawer) return;

  btn.addEventListener('click', function() {
    var isOpen = drawer.classList.contains('open');
    if (isOpen) {
      drawer.classList.remove('open');
      btn.classList.remove('open');
      document.body.style.overflow = '';
    } else {
      drawer.classList.add('open');
      btn.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
  });

  
  drawer.querySelectorAll('.drawer-link').forEach(function(link) {
    link.addEventListener('click', function() {
      drawer.classList.remove('open');
      btn.classList.remove('open');
      document.body.style.overflow = '';
    });
  });
})();
</script>

</body>

</html>
