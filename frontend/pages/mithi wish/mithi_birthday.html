<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন আমার মিথিলা পেঙ্গুইন</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --noise-texture: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.12'/%3E%3C/svg%3E");

            --p-dark-light: #3e4c5a;
            --p-dark-mid: #232b35;
            --p-dark-deep: #12171d;

            --white-pure: #ffffff;
            --white-mid: #f5f2eb;
            --white-shadow: #b8b2a2;

            --orange-bright: #ffb703;
            --orange-mid: #fb8500;
            --orange-dark: #cc5500;

            --pink-bright: #ff4d6d;
            --pink-mid: #c9184a;

            --bg-center: #0d2838;
            --bg-edge: #04121c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
        }

        body {
            background-color: var(--bg-edge);
            background-image: radial-gradient(circle at 50% 40%, var(--bg-center) 0%, var(--bg-edge) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            overflow-x: hidden;
            font-family: 'Hind Siliguri', sans-serif;
            color: white;
            user-select: none;
            position: relative;
        }

        .aurora-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            opacity: 0.8;
        }

        .aurora-wave {
            position: absolute;
            width: 200%;
            height: 100%;
            background: linear-gradient(180deg,
                rgba(52, 211, 153, 0) 0%,
                rgba(16, 185, 129, 0.45) 25%,
                rgba(5, 150, 105, 0.3) 55%,
                rgba(16, 185, 129, 0) 100%);
            filter: blur(35px);
            border-radius: 40% 60% 30% 70% / 50% 30% 70% 50%;
            animation: auroraFlow 14s ease-in-out infinite alternate;
        }

        .aurora-wave.wave2 {
            background: linear-gradient(180deg,
                rgba(110, 231, 183, 0) 0%,
                rgba(52, 211, 153, 0.35) 40%,
                rgba(4, 120, 87, 0.25) 75%,
                rgba(0, 0, 0, 0) 100%);
            animation: auroraFlow2 18s ease-in-out infinite alternate-reverse;
        }

        @keyframes auroraFlow {
            0% { transform: translateX(-20%) rotate(-3deg) scaleY(0.9); }
            50% { transform: translateX(-5%) rotate(2deg) scaleY(1.1); }
            100% { transform: translateX(-35%) rotate(-2deg) scaleY(1); }
        }

        @keyframes auroraFlow2 {
            0% { transform: translateX(-10%) rotate(4deg) scaleY(1.1); }
            100% { transform: translateX(-40%) rotate(-4deg) scaleY(0.85); }
        }

        .ice-mountains {
            position: absolute;
            bottom: 50px;
            width: 100%;
            max-width: 1200px;
            height: 280px;
            pointer-events: none;
            z-index: 2;
        }

        .ice-beach {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 160px;
            background: linear-gradient(to top, #0b2230 0%, #153c52 50%, rgba(21, 60, 82, 0) 100%);
            z-index: 3;
            pointer-events: none;
        }

        .green-shore-glow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 130px;
            background: radial-gradient(ellipse at 50% 80%, rgba(16, 185, 129, 0.4) 0%, rgba(5, 150, 105, 0.18) 50%, rgba(0,0,0,0) 80%);
            filter: blur(16px);
            z-index: 4;
            pointer-events: none;
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background:
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 240px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 85% 20%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 75% 45%, #eee, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 15% 85%, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            animation: twinkle 4s infinite linear;
            opacity: 0.7;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.95; }
        }

        .sparkle {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            pointer-events: none;
            opacity: 0;
            z-index: 6;
            animation: sparkleFloat 5s ease-in-out infinite;
        }

        @keyframes sparkleFloat {
            0% { opacity: 0; transform: translateY(0) scale(0.4); }
            20% { opacity: 0.9; }
            80% { opacity: 0.5; }
            100% { opacity: 0; transform: translateY(-140px) scale(1); }
        }

        .header-container {
            position: fixed;
            top: 28px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
            padding: 0 15px;
            pointer-events: none;
        }

        .birthday-text {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffdde1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 6px 18px rgba(255, 77, 109, 0.8));
            opacity: 0;
            transform: translateY(-25px) scale(0.85);
            animation: textFlyIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 4.2s forwards, floatHeader 3s ease-in-out 5.4s infinite;
        }

        .birthday-text span {
            display: block;
            font-size: 1.9rem;
            margin-top: 6px;
            color: #ffd166;
            -webkit-text-fill-color: #ffd166;
            filter: drop-shadow(0px 4px 12px rgba(255, 209, 102, 0.8));
        }

        @keyframes textFlyIn {
            0% {
                opacity: 0;
                transform: translateY(-30px) scale(0.8);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px) drop-shadow(0px 6px 18px rgba(255, 77, 109, 0.8));
            }
        }

        @keyframes floatHeader {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10;
            margin-bottom: 50px;
        }

        .ground-shadow {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 32px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            filter: blur(12px);
            z-index: 1;
            opacity: 0;
            animation: fadeInShadow 1s ease 2.5s forwards;
        }

        @keyframes fadeInShadow {
            to { opacity: 1; }
        }

        .fur-texture::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--noise-texture);
            mix-blend-mode: overlay;
            border-radius: inherit;
            pointer-events: none;
            z-index: 50;
        }

        .penguin {
            position: absolute;
            bottom: 20px;
            width: 140px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .penguin.boy {
            left: calc(50% - 150px);
            animation: walkInBoy 3.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards, idleBoy 4s ease-in-out 3.8s infinite;
        }

        .penguin.girl {
            left: calc(50% + 10px);
            animation: walkInGirl 3.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards, idleGirl 4.2s ease-in-out 3.8s infinite;
        }

        @keyframes walkInBoy {
            0% { transform: translateX(-55vw) rotate(-12deg); }
            20% { transform: translateX(-40vw) translateY(-14px) rotate(8deg); }
            40% { transform: translateX(-26vw) translateY(0px) rotate(-8deg); }
            60% { transform: translateX(-14vw) translateY(-12px) rotate(8deg); }
            80% { transform: translateX(-5vw) translateY(0px) rotate(-4deg); }
            100% { transform: translateX(0px) translateY(0px) rotate(4deg); }
        }

        @keyframes walkInGirl {
            0% { transform: translateX(55vw) rotate(12deg); }
            20% { transform: translateX(40vw) translateY(-14px) rotate(-8deg); }
            40% { transform: translateX(26vw) translateY(0px) rotate(8deg); }
            60% { transform: translateX(14vw) translateY(-12px) rotate(-8deg); }
            80% { transform: translateX(5vw) translateY(0px) rotate(4deg); }
            100% { transform: translateX(0px) translateY(0px) rotate(-4deg); }
        }

        @keyframes idleBoy {
            0%, 100% { transform: translateX(0px) translateY(0) rotate(4deg); }
            50% { transform: translateX(0px) translateY(-4px) rotate(2deg); }
        }

        @keyframes idleGirl {
            0%, 100% { transform: translateX(0px) translateY(0) rotate(-4deg); }
            50% { transform: translateX(0px) translateY(-4px) rotate(-2deg); }
        }

        .p-head {
            position: relative;
            width: 125px;
            height: 115px;
            background: radial-gradient(circle at 35% 25%, var(--p-dark-light) 0%, var(--p-dark-mid) 50%, var(--p-dark-deep) 100%);
            border-radius: 50% 50% 42% 42% / 55% 55% 45% 45%;
            box-shadow: inset -6px -10px 16px rgba(0,0,0,0.8), 0 6px 10px rgba(0,0,0,0.3);
            z-index: 20;
            margin-bottom: -30px;
        }

        .p-face-svg {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 85px;
            z-index: 21;
        }

        .eyes {
            position: absolute;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            display: flex;
            justify-content: space-between;
            z-index: 30;
        }

        .eye {
            width: 15px;
            height: 22px;
            background: #111;
            border-radius: 50%;
            position: relative;
            animation: blink 4s infinite;
        }

        .eye::after {
            content: '';
            position: absolute;
            top: 3px;
            width: 5px;
            height: 7px;
            background: #fff;
            border-radius: 50%;
        }

        .boy .eye::after { left: 7px; }
        .girl .eye::after { left: 2px; }

        .girl .eye::before {
            content: '';
            position: absolute;
            top: -3px;
            right: -4px;
            width: 8px;
            height: 6px;
            border-top: 2px solid #111;
            border-right: 2px solid #111;
            border-radius: 0 100% 0 0;
            transform: rotate(15deg);
        }
        .girl .eye:first-child::before {
            right: auto;
            left: -4px;
            border-right: none;
            border-left: 2px solid #111;
            border-radius: 100% 0 0 0;
            transform: rotate(-15deg);
        }

        @keyframes blink {
            0%, 46%, 48%, 100% { transform: scaleY(1); }
            47% { transform: scaleY(0.1); }
        }

        .beak {
            position: absolute;
            top: 52px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 18px;
            background: radial-gradient(ellipse at 50% 20%, var(--orange-bright) 0%, var(--orange-mid) 50%, var(--orange-dark) 100%);
            border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
            box-shadow: 0 3px 5px rgba(0,0,0,0.35);
            z-index: 31;
        }

        .blush {
            position: absolute;
            top: 50px;
            width: 20px;
            height: 10px;
            background: var(--pink-bright);
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.65;
            z-index: 25;
        }
        .blush.left { left: 12px; }
        .blush.right { right: 12px; }

        .p-body {
            position: relative;
            width: 132px;
            height: 145px;
            background: radial-gradient(circle at 35% 30%, var(--p-dark-light) 0%, var(--p-dark-mid) 50%, var(--p-dark-deep) 100%);
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8);
            z-index: 10;
            display: flex;
            justify-content: center;
        }

        .p-belly {
            position: absolute;
            bottom: 4px;
            width: 102px;
            height: 120px;
            background: radial-gradient(circle at 45% 30%, var(--white-pure) 0%, var(--white-mid) 55%, var(--white-shadow) 100%);
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            box-shadow: inset -6px -10px 14px rgba(0,0,0,0.2);
            z-index: 11;
        }

        .flipper {
            position: absolute;
            top: 100px;
            width: 32px;
            height: 80px;
            background: radial-gradient(ellipse at 35% 25%, var(--p-dark-light) 0%, var(--p-dark-mid) 60%, var(--p-dark-deep) 100%);
            border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
            z-index: 15;
            box-shadow: inset -3px -6px 10px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.3);
            transform-origin: top center;
            transition: transform 0.6s ease;
        }

        .boy .flipper.left {
            left: -12px;
            transform: rotate(20deg);
            animation: outerWaveBoy 3s ease-in-out infinite 3.5s;
        }
        .girl .flipper.right {
            right: -12px;
            transform: rotate(-20deg);
            animation: outerWaveGirl 3.2s ease-in-out infinite 3.5s;
        }

        .boy .flipper.right {
            right: -10px;
            transform: rotate(-15deg);
            animation: holdHandBoy 0.6s ease-out 3.3s forwards;
            z-index: 18;
        }
        .girl .flipper.left {
            left: -10px;
            transform: rotate(15deg);
            animation: holdHandGirl 0.6s ease-out 3.3s forwards;
            z-index: 18;
        }

        @keyframes holdHandBoy {
            to { transform: rotate(-58deg) translateY(-4px); }
        }
        @keyframes holdHandGirl {
            to { transform: rotate(58deg) translateY(-4px); }
        }

        @keyframes outerWaveBoy {
            0%, 100% { transform: rotate(20deg); }
            50% { transform: rotate(35deg); }
        }
        @keyframes outerWaveGirl {
            0%, 100% { transform: rotate(-20deg); }
            50% { transform: rotate(-35deg); }
        }

        .feet-container {
            position: absolute;
            bottom: -10px;
            width: 85px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }
        .foot {
            width: 35px;
            height: 18px;
            background: radial-gradient(circle at 30% 30%, var(--orange-bright) 0%, var(--orange-mid) 50%, var(--orange-dark) 100%);
            border-radius: 50% 50% 40% 40% / 70% 70% 30% 30%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .foot.left { transform: rotate(-10deg); }
        .foot.right { transform: rotate(10deg); }

        .bow {
            position: absolute;
            top: -2px;
            right: 18px;
            width: 32px;
            height: 16px;
            z-index: 35;
            transform: rotate(18deg);
        }
        .bow-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 9px; height: 9px;
            background: var(--pink-mid);
            border-radius: 50%;
            z-index: 2;
        }
        .bow-left, .bow-right {
            position: absolute;
            top: 0;
            width: 16px; height: 16px;
            background: var(--pink-bright);
            border-radius: 50% 10% 10% 50%;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);
        }
        .bow-left { left: -3px; }
        .bow-right { right: -3px; transform: scaleX(-1); }

        .heart-container {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            z-index: 40;
            opacity: 0;
            cursor: pointer;
            animation: popHeart 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 3.6s forwards, pulseHeart 1.4s ease-in-out 4.4s infinite;
        }

        .heart {
            position: relative;
            width: 32px;
            height: 32px;
            background-color: var(--pink-bright);
            transform: rotate(-45deg);
            box-shadow: inset 6px 6px 10px rgba(255,255,255,0.4), 0 0 25px rgba(255, 77, 109, 0.9);
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            background-color: var(--pink-bright);
            border-radius: 50%;
        }
        .heart::before {
            top: -16px; left: 0;
        }
        .heart::after {
            top: 0; left: 16px;
        }

        .heart-hint {
            position: absolute;
            top: -26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            white-space: nowrap;
            color: #ffe3e9;
            background: rgba(0,0,0,0.35);
            padding: 3px 9px;
            border-radius: 10px;
            opacity: 0;
            animation: hintShow 2.4s ease-in-out 5.4s infinite;
            pointer-events: none;
        }

        @keyframes hintShow {
            0%, 20% { opacity: 0; transform: translateX(-50%) translateY(4px); }
            35%, 65% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85%, 100% { opacity: 0; transform: translateX(-50%) translateY(-4px); }
        }

        @keyframes popHeart {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }

        @keyframes pulseHeart {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.2); }
        }

        .replay-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 150;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 8px 22px;
            border-radius: 25px;
            font-size: 0.92rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .replay-btn:hover {
            background: rgba(255, 77, 109, 0.45);
            border-color: rgba(255, 77, 109, 0.7);
            transform: translateX(-50%) translateY(-2px);
        }

        .letter-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 8, 14, 0.82);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 24px;
        }

        .letter-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .letter-card {
            position: relative;
            width: 100%;
            max-width: 620px;
            max-height: 82vh;
            overflow-y: auto;
            background: linear-gradient(160deg, #fffaf3 0%, #fdf1e7 100%);
            color: #2c1e1e;
            border-radius: 18px;
            padding: 42px 34px 34px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.55), 0 0 40px rgba(255,77,109,0.25);
            transform: translateY(30px) scale(0.92);
            transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .letter-overlay.open .letter-card {
            transform: translateY(0) scale(1);
        }

        .letter-card h2 {
            font-size: 1.5rem;
            color: var(--pink-mid);
            margin-bottom: 18px;
            text-align: center;
        }

        .letter-body {
            font-size: 1.02rem;
            line-height: 1.9;
            white-space: pre-wrap;
        }

        .letter-close {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.08);
            color: #2c1e1e;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .letter-close:hover { background: rgba(255,77,109,0.25); }

        @media (max-width: 550px) {
            .header-container { top: 18px; }
            .birthday-text { font-size: 2.1rem; }
            .birthday-text span { font-size: 1.3rem; }
            .stage { transform: scale(0.82); transform-origin: bottom center; margin-bottom: 30px; }
            .letter-card { padding: 32px 20px 26px; }
            .letter-body { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="aurora-container">
        <div class="aurora-wave"></div>
        <div class="aurora-wave wave2"></div>
    </div>

    <svg class="ice-mountains" viewBox="0 0 1200 300" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="iceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.85"/>
                <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
            </linearGradient>
            <linearGradient id="iceGrad2" x1="0%" y1="0%" x2="0%" y2="100%">

    <script>
        const LETTER_TEXT = "\u099c\u09a8\u09cd\u09ae\u09a6\u09bf\u09a8, \u0986\u09ae\u09be\u09b0 \u09aa\u09cd\u09b0\u09bf\u09af\u09bc\u09a4\u09ae\u09be \u09ae\u09bf\u09a5\u09bf \u09aa\u09c7\u0999\u09cd\u0997\u09c1\u0987\u09a8\u0964\n\n\u0986\u099c \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09aa\u09b0\u09bf\u099a\u09af\u09bc\u09c7\u09b0 \u09ac\u09af\u09bc\u09b8 \u09ae\u09be\u09a4\u09cd\u09b0 \u0995\u09bf\u099b\u09c1\u09a6\u09bf\u09a8\u09c7\u09b0, \u09a4\u09ac\u09c1\u0993 \u0995\u09c7\u09a8 \u099c\u09be\u09a8\u09bf \u09ae\u09a8\u09c7 \u09b9\u09af\u09bc, \u09a4\u09cb\u09ae\u09be\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u0986\u09ae\u09be\u09b0 \u098f\u0987 \u09b8\u09be\u0995\u09cd\u09b7\u09be\u09ce \u09af\u09c7\u09a8 \u0986\u099c\u0995\u09c7\u09b0 \u09a8\u09af\u09bc; \u09af\u09c7\u09a8 \u0995\u09cb\u09a8\u09cb \u098f\u0995 \u0985\u09a6\u09c3\u09b6\u09cd\u09af \u09aa\u09c2\u09b0\u09cd\u09ac\u09aa\u09b0\u09bf\u099a\u09af\u09bc\u09c7\u09b0 \u09b8\u09c2\u09a4\u09cd\u09b0 \u09a7\u09b0\u09c7, \u09b8\u09c7\u0987 \u09b0\u09c2\u09b9\u09c7\u09b0 \u099c\u0997\u09a4\u09c7\u09b0 \u0995\u09cb\u09a8\u09cb \u098f\u0995 \u099a\u09bf\u09b0\u099a\u09c7\u09a8\u09be \u0986\u09b8\u09ae\u09be\u09a8 \u09a5\u09c7\u0995\u09c7 \u09a4\u09c1\u09ae\u09bf \u0986\u09ae\u09be\u09b0 \u099c\u09c0\u09ac\u09a8\u09c7 \u098f\u09b8\u09c7 \u09a7\u09b0\u09be \u09a6\u09bf\u09af\u09bc\u09c7\u099b\u09cb\u0964\n\n\u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09aa\u09c7\u09af\u09bc\u09c7 \u0986\u09ae\u09bf \u09a7\u09a8\u09cd\u09af\u0964 \u09a4\u09cb\u09ae\u09be\u09b0 \u09aa\u09b0\u09b6\u09c7, \u09a4\u09cb\u09ae\u09be\u09b0 \u09ae\u09be\u09af\u09bc\u09be\u09af\u09bc, \u09a4\u09cb\u09ae\u09be\u09b0 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be\u09af\u09bc \u0986\u09ae\u09bf \u09a7\u09a8\u09cd\u09af\u0964 \u0986\u09ae\u09be\u09b0 \u09b8\u09ae\u09b8\u09cd\u09a4 \u09ac\u0995\u09ac\u0995\u09be\u09a8\u09bf, \u09b8\u09ae\u09b8\u09cd\u09a4 \u0985\u09ad\u09bf\u09ae\u09be\u09a8, \u09b8\u09ae\u09b8\u09cd\u09a4 \u099c\u09cd\u09ac\u09be\u09b2\u09be, \u09b8\u09ae\u09b8\u09cd\u09a4 \u0989\u09a6\u09cd\u09ad\u099f\u09a4\u09be, \u09b8\u09ac\u0995\u09bf\u099b\u09c1 \u09b8\u09b9\u09cd\u09af \u0995\u09b0\u09c7\u0993 \u09a4\u09c1\u09ae\u09bf \u09af\u09c7\u09ad\u09be\u09ac\u09c7 \u09a4\u09cb\u09ae\u09be\u09b0 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be \u0986\u09b0 \u09ae\u09be\u09af\u09bc\u09be\u09b0 \u09ae\u09cb\u09b9\u09c7 \u0986\u09ae\u09be\u0995\u09c7 \u0986\u0997\u09b2\u09c7 \u09b0\u09be\u0996\u09cb, \u09a4\u09be \u0986\u09ae\u09be\u0995\u09c7 \u09ac\u09be\u09b0\u09ac\u09be\u09b0 \u09ac\u09bf\u09b8\u09cd\u09ae\u09bf\u09a4 \u0995\u09b0\u09c7\u0964 \u09ae\u09a8\u09c7 \u09b9\u09af\u09bc, \u0986\u09ae\u09bf \u09af\u09c7\u09a8 \u09a4\u09cb\u09ae\u09be\u09b0\u0987 \u0997\u09be\u09af\u09bc\u09c7\u09b0 \u09aa\u09cb\u09b6\u09be\u0995, \u09a4\u09cb\u09ae\u09be\u09b0 \u0996\u09c1\u09ac \u0986\u09aa\u09a8, \u09a4\u09cb\u09ae\u09be\u09b0 \u0996\u09c1\u09ac \u0995\u09be\u099b\u09c7\u09b0\u0964\n\n\u0986\u099c \u09a4\u09cb\u09ae\u09be\u09b0 \u098f\u0987 \u09ac\u09bf\u09b6\u09c7\u09b7 \u09a6\u09bf\u09a8\u09c7, \u0986\u09ae\u09be\u09b0 \u0985\u09a8\u09cd\u09a4\u09b8\u09cd\u09a4\u09b2\u09c7\u09b0 \u098f\u0995\u09c7\u09ac\u09be\u09b0\u09c7 \u0997\u09ad\u09c0\u09b0\u09a4\u09ae \u09aa\u09cd\u09b0\u09be\u09a8\u09cd\u09a4 \u09a5\u09c7\u0995\u09c7 \u09a4\u09cb\u09ae\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u09b0\u0987\u09b2 \u0985\u09ab\u09c1\u09b0\u09a8\u09cd\u09a4 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be, \u09ae\u09be\u09af\u09bc\u09be, \u09a6\u09af\u09bc\u09be, \u09b8\u09c1\u0996, \u09a6\u09c1\u0983\u0996, \u09aa\u09cd\u09b0\u09be\u09b0\u09cd\u09a5\u09a8\u09be \u0986\u09b0 \u0985\u0997\u09a3\u09bf\u09a4 \u09b6\u09c1\u09ad\u0995\u09be\u09ae\u09a8\u09be\u0964\n\n\u0986\u09ae\u09bf \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09ae\u09bf\u09a5\u09cd\u09af\u09c7 \u0995\u09cb\u09a8\u09cb \u09aa\u09cd\u09b0\u09a4\u09bf\u09b6\u09cd\u09b0\u09c1\u09a4\u09bf \u09a6\u09bf\u09af\u09bc\u09c7 \u09a4\u09cb\u09ae\u09be\u09b0 \u0995\u09be\u099b\u09c7 \u0995\u09bf\u0982\u09ac\u09be \u0995\u09c7\u09af\u09bc\u09be\u09ae\u09a4\u09c7\u09b0 \u09a6\u09bf\u09a8\u09c7 \u0986\u09ae\u09be\u09b0 \u09b8\u09c3\u09b7\u09cd\u099f\u09bf\u0995\u09b0\u09cd\u09a4\u09be\u09b0 \u0995\u09be\u099b\u09c7 \u0985\u09aa\u09b0\u09be\u09a7\u09c0 \u09b9\u09af\u09bc\u09c7 \u09a6\u09be\u0981\u09dc\u09be\u09a4\u09c7 \u099a\u09be\u0987 \u09a8\u09be\u0964 \u09a4\u09be\u0987 \u09af\u09c7 \u0995\u09a5\u09be\u0997\u09c1\u09b2\u09cb \u09ac\u09b2\u09bf, \u09b8\u09c7\u0997\u09c1\u09b2\u09cb \u0986\u09ae\u09be\u09b0 \u09b9\u09c3\u09a6\u09af\u09bc\u09c7\u09b0 \u0997\u09ad\u09c0\u09b0 \u09ac\u09bf\u09b6\u09cd\u09ac\u09be\u09b8 \u09a5\u09c7\u0995\u09c7\u0987 \u09ac\u09b2\u09bf\u0964\n\n\u09a4\u09c1\u09ae\u09bf \u09ac\u09c7\u0981\u099a\u09c7 \u09a5\u09c7\u0995\u09cb \u0986\u09ae\u09be\u09b0 \u09b9\u09af\u09bc\u09c7, \u0986\u09ae\u09be\u09b0 \u099c\u09a8\u09cd\u09af\u0964 \u0986\u09b0 \u0986\u09ae\u09bf \u09a4\u09cb\u09ae\u09be\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u09ae\u09bf\u09b2\u09c7 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u098f\u0987 \u09a6\u09c1\u09a8\u09bf\u09af\u09bc\u09be\u09a4\u09c7\u0987 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09a8\u09bf\u099c\u09c7\u09a6\u09c7\u09b0 \u098f\u0995\u099f\u09bf \u09b8\u09c1\u0996\u09c7\u09b0 \u09b8\u09cd\u09ac\u09b0\u09cd\u0997 \u0997\u09dc\u09c7 \u09a4\u09c1\u09b2\u09a4\u09c7 \u099a\u09be\u0987\u0964\n\n\u0986\u09ae\u09be\u09b0 \u099c\u09c0\u09ac\u09a8\u09c7\u09b0 \u09b6\u09c7\u09b7 \u09a8\u09bf\u09b6\u09cd\u09ac\u09be\u09b8 \u09aa\u09b0\u09cd\u09af\u09a8\u09cd\u09a4 \u0986\u09ae\u09bf \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u0986\u09ae\u09be\u09b0 \u09aa\u09be\u09b6\u09c7 \u099a\u09be\u0987\u0964 \u09a4\u09cb\u09ae\u09be\u09b0 \u09b8\u09c1\u0996\u09c7\u09b0 \u09ad\u09be\u09b0 \u09af\u09c7\u09ae\u09a8 \u09a8\u09bf\u09a4\u09c7 \u099a\u09be\u0987, \u09a4\u09c7\u09ae\u09a8\u09bf \u09a4\u09cb\u09ae\u09be\u09b0 \u09a6\u09c1\u0983\u0996\u09c7\u09b0 \u09ad\u09be\u09b0\u0993 \u0986\u09ae\u09be\u09b0 \u0995\u09be\u0981\u09a7\u09c7 \u09a4\u09c1\u09b2\u09c7 \u09a8\u09bf\u09a4\u09c7 \u099a\u09be\u0987\u0964 \u09a4\u09cb\u09ae\u09be\u09b0 \u09b9\u09be\u09b8\u09bf\u09b0 \u09a6\u09bf\u09a8\u09c7 \u09a4\u09cb\u09ae\u09be\u09b0 \u09b9\u09be\u09b8\u09bf\u09b0 \u0995\u09be\u09b0\u09a3 \u09b9\u09a4\u09c7 \u099a\u09be\u0987, \u0986\u09b0 \u09a4\u09cb\u09ae\u09be\u09b0 \u0995\u09be\u09a8\u09cd\u09a8\u09be\u09b0 \u09a6\u09bf\u09a8\u09c7 \u09a4\u09cb\u09ae\u09be\u09b0 \u099a\u09cb\u0996\u09c7\u09b0 \u099c\u09b2 \u09ae\u09c1\u099b\u09c7 \u09a6\u09c7\u0993\u09af\u09bc\u09be \u09ae\u09be\u09a8\u09c1\u09b7\u099f\u09bf \u09b9\u09a4\u09c7 \u099a\u09be\u0987\u0964\n\n\u09a4\u09c1\u09ae\u09bf \u0986\u09ae\u09be\u09b0 \u09ae\u09be\u09a5\u09be\u09b0 \u09ae\u09c1\u0995\u09c1\u099f, \u09a4\u09c1\u09ae\u09bf \u0986\u09ae\u09be\u09b0 \u09b0\u09be\u09a8\u09bf\u0964 \u09a4\u09c1\u09ae\u09bf \u0995\u09cb\u09a8\u09cb\u09a6\u09bf\u09a8 \u0986\u09ae\u09be\u0995\u09c7 \u09b9\u09be\u09b0\u09be\u09a8\u09cb\u09b0 \u09ad\u09af\u09bc \u09aa\u09c7\u09af\u09bc\u09cb \u09a8\u09be\u0964 \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u099b\u09c7\u09dc\u09c7 \u0986\u09ae\u09bf \u0995\u09cb\u09a8\u09cb\u09a6\u09bf\u09a8 \u0995\u09cb\u09a5\u09be\u0993 \u099a\u09b2\u09c7 \u09af\u09be\u09ac \u09a8\u09be, \u098f\u0987 \u09ac\u09bf\u09b6\u09cd\u09ac\u09be\u09b8\u099f\u09c1\u0995\u09c1 \u09a4\u09cb\u09ae\u09be\u09b0 \u09b9\u09c3\u09a6\u09af\u09bc\u09c7 \u09b0\u09c7\u0996\u09cb\u0964\n\n\u09a4\u09c1\u09ae\u09bf \u0986\u09ae\u09be\u09b0 \u099c\u09c0\u09ac\u09a8\u09c7 \u098f\u09b8\u09c7\u099b\u09cb, \u0986\u09ae\u09be\u0995\u09c7 \u09a4\u09cb\u09ae\u09be\u09b0 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be\u09af\u09bc \u09b6\u09be\u09a8\u09cd\u09a4\u09bf \u09a6\u09bf\u09af\u09bc\u09c7\u099b\u09cb, \u098f\u09b0 \u099c\u09a8\u09cd\u09af \u09a4\u09cb\u09ae\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf \u0986\u09ae\u09bf \u099a\u09bf\u09b0\u0995\u09c3\u09a4\u099c\u09cd\u099e, \u09ae\u09b9\u09be\u0995\u09c3\u09a4\u099c\u09cd\u099e\u0964 \u09b6\u09c1\u09a7\u09c1 \u09a4\u09cb\u09ae\u09be\u09b0 \u0995\u09be\u099b\u09c7 \u0986\u09ae\u09be\u09b0 \u098f\u0995\u099f\u09c1\u0995\u09c1 \u0986\u09ac\u09a6\u09be\u09b0, \u0986\u09ae\u09be\u0995\u09c7 \u09ac\u09c7\u09b6\u09bf\u09a6\u09bf\u09a8 \u098f\u0995\u09be \u0995\u09b0\u09c7 \u09b0\u09c7\u0996\u09cb \u09a8\u09be\u0964\n\n\u0986\u09ae\u09bf \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09a8\u09bf\u099c\u09c7\u09b0 \u0995\u09b0\u09c7 \u09a8\u09bf\u09a4\u09c7 \u099a\u09be\u0987\u0964 \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u099b\u09be\u09dc\u09be \u0986\u09ae\u09be\u09b0 \u098f\u0995\u099f\u09c1\u0993 \u09ad\u09be\u09b2\u09cb \u09b2\u09be\u0997\u09c7 \u09a8\u09be\u0964 \u0986\u09ae\u09bf \u099a\u09be\u0987, \u09a4\u09cb\u09ae\u09be\u09b0 \u0995\u09cb\u09b2\u09c7 \u09ae\u09be\u09a5\u09be \u09b0\u09c7\u0996\u09c7 \u0986\u09ae\u09be\u09b0 \u09b8\u09ae\u09b8\u09cd\u09a4 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4\u09bf\u09b0 \u0985\u09ac\u09b8\u09be\u09a8 \u09b9\u09cb\u0995; \u09a4\u09cb\u09ae\u09be\u09b0 \u09b8\u09cd\u09a8\u09c7\u09b9\u09c7\u09b0 \u0986\u09b6\u09cd\u09b0\u09af\u09bc\u09c7 \u0986\u09ae\u09be\u09b0 \u099c\u09c0\u09ac\u09a8\u09c7\u09b0 \u09b6\u09c7\u09b7 \u09a8\u09bf\u09b6\u09cd\u09ac\u09be\u09b8\u099f\u09c1\u0995\u09c1\u0993 \u09b6\u09be\u09a8\u09cd\u09a4\u09bf\u09a4\u09c7 \u09ae\u09bf\u09b6\u09c7 \u09af\u09be\u0995\u0964\n\n\u0986\u09ae\u09bf \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u098f\u09ae\u09a8 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be \u09a6\u09bf\u09af\u09bc\u09c7 \u0986\u0997\u09b2\u09c7 \u09b0\u09be\u0996\u09a4\u09c7 \u099a\u09be\u0987, \u098f\u09ae\u09a8 \u0997\u09ad\u09c0\u09b0 \u09ae\u09be\u09af\u09bc\u09be\u09af\u09bc \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u099c\u09dc\u09bf\u09af\u09bc\u09c7 \u09b0\u09be\u0996\u09a4\u09c7 \u099a\u09be\u0987, \u09af\u09c7\u09a8 \u09a4\u09c1\u09ae\u09bf \u09ac\u09be\u09b0\u09ac\u09be\u09b0 \u099c\u09a8\u09cd\u09ae \u09a8\u09bf\u09b2\u09c7\u0993, \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u099c\u09a8\u09cd\u09ae\u09c7 \u0986\u09ae\u09be\u09b0 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be\u09b0 \u09a4\u09c3\u09b7\u09cd\u09a3\u09be \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09b8\u09c3\u09b7\u09cd\u099f\u09bf\u0995\u09b0\u09cd\u09a4\u09be\u09b0 \u0995\u09be\u099b\u09c7 \u09ac\u09b2\u09a4\u09c7 \u09b9\u09af\u09bc, \u201c\u09a4\u09c1\u09ae\u09bf \u09b6\u09c1\u09a7\u09c1 \u0986\u09ae\u09be\u0995\u09c7\u0987 \u099a\u09be\u0993\u0964\u201d\n\n\u0986\u09ae\u09be\u09b0 \u099c\u09c0\u09ac\u09a8\u09c7 \u0986\u09b8\u09be \u09a4\u09c1\u09ae\u09bf \u0986\u09ae\u09be\u09b0 \u09b6\u09cd\u09b0\u09c7\u09b7\u09cd\u09a0 \u09ac\u09b0\u0995\u09a4, \u0986\u09ae\u09be\u09b0 \u09b6\u09cd\u09b0\u09c7\u09b7\u09cd\u09a0 \u09ae\u09be\u09a8\u09ac\u09bf\u0995\u09be, \u0986\u09ae\u09be\u09b0 \u09b6\u09cd\u09b0\u09c7\u09b7\u09cd\u09a0 \u09a8\u09be\u09b0\u09c0\u0964 \u0986\u09ae\u09bf \u099a\u09bf\u09b0\u099c\u09c0\u09ac\u09a8 \u09a6\u09cb\u09af\u09bc\u09be \u0995\u09b0\u09bf \u09a4\u09c1\u09ae\u09bf \u09b8\u09a6\u09be \u09b8\u09c1\u0996\u09c0 \u09b9\u0993, \u09ad\u09be\u09b2\u09cb \u09a5\u09be\u0995\u09cb, \u09b8\u09c1\u09b8\u09cd\u09a5 \u09a5\u09be\u0995\u09cb; \u0986\u09b0 \u0986\u09ae\u09be\u09b0 \u098f\u0987 \u09aa\u09ac\u09bf\u09a4\u09cd\u09b0 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be\u09b0 \u09aa\u09b0\u09b6\u09c7, \u0986\u09ae\u09be\u09b0 \u09ae\u09be\u09af\u09bc\u09be\u09b0 \u099b\u09be\u09af\u09bc\u09be\u09af\u09bc, \u0986\u09ae\u09be\u09b0 \u09b8\u0999\u09cd\u0997\u09c0 \u09b9\u09af\u09bc\u09c7 \u09a5\u09c7\u0995\u09cb\u0964\n\n\u0986\u09ae\u09be\u09b0 \u09aa\u09cd\u09b0\u09bf\u09af\u09bc\u09a4\u09ae\u09be, \u0986\u09ae\u09be\u09b0 \u09b8\u0999\u09cd\u0997\u09bf\u09a8\u09c0, \u0986\u09ae\u09be\u09b0 \u0985\u09b0\u09cd\u09a7\u09be\u0999\u09cd\u0997\u09bf\u09a8\u09c0, \u0986\u09ae\u09be\u09b0 \u09ae\u09be\u09af\u09bc\u09be\u09ac\u09bf\u09a8\u09c0, \u0986\u09ae\u09be\u09b0 \u09b0\u09c2\u09b9\u09bf, \u0986\u09ae\u09be\u09b0 \u0995\u09be\u09b2\u09ac\u09c0, \u0986\u09ae\u09be\u09b0 \u09b8\u09c1\u0995\u09c7\u09b6\u09bf\u09a8\u09c0, \u0986\u09ae\u09be\u09b0 \u09ac\u09c1\u0995\u09c7\u09b0 \u09aa\u09be\u0981\u099c\u09b0 \u09a5\u09c7\u0995\u09c7 \u0997\u09dc\u09c7 \u0993\u09a0\u09be \u09b8\u09c7\u0987 \u0986\u09aa\u09a8 \u0985\u0982\u09b6\u0964\n\n\u0986\u09ae\u09bf \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u098f\u09a4\u099f\u09be\u0987 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09bf, \u098f\u09a4\u099f\u09be\u0987 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09bf \u09af\u09c7, \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u099b\u09be\u09dc\u09be \u0986\u09ae\u09be\u09b0 \u09b9\u09c3\u09a6\u09af\u09bc \u09af\u09c7\u09a8 \u098f\u0995 \u0985\u09a8\u09a8\u09cd\u09a4 \u09ae\u09b0\u09c1\u09ad\u09c2\u09ae\u09bf \u09af\u09c7\u0996\u09be\u09a8\u09c7 \u0995\u09cb\u09a8\u09cb \u09b8\u09ac\u09c1\u099c \u09a8\u09c7\u0987, \u0995\u09cb\u09a8\u09cb \u09ac\u09c3\u09b7\u09cd\u099f\u09bf \u09a8\u09c7\u0987, \u0995\u09cb\u09a8\u09cb \u09b0\u0982\u09a7\u09a8\u09c1 \u09a8\u09c7\u0987\u0964 \u09a4\u09c1\u09ae\u09bf \u098f\u09b8\u09cb \u0986\u09ae\u09be\u09b0 \u099c\u09c0\u09ac\u09a8\u09c7 \u09ac\u09c3\u09b7\u09cd\u099f\u09bf\u09b0 \u09ae\u09a4\u09cb, \u09b0\u0982\u09a7\u09a8\u09c1\u09b0 \u09ae\u09a4\u09cb, \u09b6\u09be\u09a8\u09cd\u09a4\u09bf\u09b0 \u09ae\u09a4\u09cb\u0964 \u0986\u09b0 \u09a5\u09c7\u0995\u09cb \u0986\u09ae\u09be\u09b0 \u09b9\u09af\u09bc\u09c7, \u0986\u09ae\u09be\u09b0 \u09aa\u09be\u09b6\u09c7, \u0986\u09ae\u09be\u09b0 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be\u09af\u09bc\u0964\n\n\u09b6\u09c1\u09ad \u099c\u09a8\u09cd\u09ae\u09a6\u09bf\u09a8, \u0986\u09ae\u09be\u09b0 \u09aa\u09cd\u09b0\u09bf\u09af\u09bc\u09a4\u09ae\u09be \u09ae\u09bf\u09a5\u09bf \u09aa\u09c7\u0999\u09cd\u0997\u09c1\u0987\u09a8\u0964\n\n\u09a4\u09cb\u09ae\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u0986\u0997\u09be\u09ae\u09c0 \u09a6\u09bf\u09a8 \u09b9\u09cb\u0995 \u0986\u099c\u0995\u09c7\u09b0 \u099a\u09c7\u09af\u09bc\u09c7\u0993 \u09b8\u09c1\u09a8\u09cd\u09a6\u09b0, \u09a4\u09cb\u09ae\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u09b8\u0995\u09be\u09b2 \u09b9\u09cb\u0995 \u09b6\u09be\u09a8\u09cd\u09a4\u09bf\u09b0, \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u09b0\u09be\u09a4 \u09b9\u09cb\u0995 \u09aa\u09cd\u09b0\u09b6\u09be\u09a8\u09cd\u09a4\u09bf\u09b0, \u0986\u09b0 \u09a4\u09cb\u09ae\u09be\u09b0 \u099c\u09c0\u09ac\u09a8\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u0985\u09a7\u09cd\u09af\u09be\u09af\u09bc\u09c7 \u09af\u09c7\u09a8 \u0986\u09b2\u09cd\u09b2\u09be\u09b9 \u09a4\u09cb\u09ae\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u09b0\u09b9\u09ae\u09a4, \u09ac\u09b0\u0995\u09a4 \u0993 \u0985\u09ab\u09c1\u09b0\u09a8\u09cd\u09a4 \u09b8\u09c1\u0996 \u09b2\u09bf\u0996\u09c7 \u09a6\u09c7\u09a8\u0964\n\n\u09ad\u09be\u09b2\u09cb \u09a5\u09c7\u0995\u09cb, \u0986\u09ae\u09be\u09b0 \u09b0\u09be\u09a8\u09bf\u0964 \u0986\u09ae\u09be\u09b0 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be\u09af\u09bc \u09a5\u09c5\u0995\u09cb\u0964 \u0986\u09ae\u09be\u09b0 \u09aa\u09be\u09b6\u09c7 \u09a5\u09c5\u0995\u09cb\u0964 \u099a\u09bf\u09b0\u0995\u09be\u09b2\u0964\n\n\u0987\u09a4\u09bf\n\u09a4\u09cb\u09ae\u09be\u09b0 \u09ae\u09bf\u0983 \u099f\u09cd\u09b0\u09be\u09ac\u09b2 \u09ae\u09c7\u0995\u09be\u09b0 \u09aa\u09be\u09ac\u09c7\u09b2";

        document.getElementById('letterBody').textContent = LETTER_TEXT;

        });
        closeBtn.addEventListener('click', closeLetter);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) closeLetter(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLetter(); });

        function spawnSparkles() {
            const field = document.getElementById('sparkleField');
            field.innerHTML = '';
            for (let i = 0; i < 26; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                const size = 2 + Math.random() * 3;
                s.style.width = size + 'px';
                s.style.height = size + 'px';
                s.style.left = Math.random() * 100 + 'vw';
                s.style.bottom = (Math.random() * 30) + 'vh';
                s.style.animationDelay = (Math.random() * 5) + 's';
                s.style.animationDuration = (4 + Math.random() * 3) + 's';
                field.appendChild(s);
            }
        }
        spawnSparkles();

        function restartAnimation() {
            const newEl = document.body.cloneNode(true);
            document.body.parentNode.replaceChild(newEl, document.body);
        }
    </script>
</body>
</html>
